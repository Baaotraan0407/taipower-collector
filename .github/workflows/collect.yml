name: Collect Taipower generation

on:
  schedule:
    - cron: "*/10 * * * *"   # moi 10 phut (gio UTC, khong anh huong)
  workflow_dispatch:          # cho phep bam chay tay de kiem tra

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tai du lieu
        run: python3 collect.py

      - name: Luu vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done